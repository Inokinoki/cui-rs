name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 and the software GL stack
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl1-mesa-dri xvfb
      - name: Generated files are current
        run: |
          python3 scripts/gen_ffi.py
          git diff --exit-code -- cui cui-sys scripts
      - name: Every extern declaration matches its C prototype
        run: scripts/sigcheck.sh
      - run: cargo test
      - name: Feature combinations compile
        run: |
          cargo build -p cui-sys --no-default-features
          cargo build -p cui-sys --no-default-features --features default-fonts
          cargo build -p cui-sys --no-default-features --features stb-image,text-shaping
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Doc links
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p cui-rs -p cui-sys
      - run: cargo build --release --examples
      - name: Smoke test every example under Xvfb
        run: xvfb-run -a -s "-screen 0 1280x800x24" scripts/smoke.sh target/release/examples
      - name: Screenshot every gallery page and validate the PNGs
        run: |
          mkdir -p /tmp/cui-gallery
          pages=27  # 9 base pages + 18 extended pages; shot mode takes a 0-based index
          for p in $(seq 0 $((pages - 1))); do
            xvfb-run -a -s "-screen 0 1280x800x24" \
              env CUI_GALLERY_SHOT=/tmp/cui-gallery/page-$p.png:$p \
              timeout 120 ./target/release/examples/gallery
          done
          python3 scripts/check_png.py /tmp/cui-gallery/page-*.png
      - name: Convert smoke screenshots
        if: success() || failure()
        run: |
          if ! command -v convert >/dev/null; then sudo apt-get install -y imagemagick; fi
          for f in /tmp/cui-smoke/*.xwd; do
            [ -e "$f" ] || continue
            convert "$f" "${f%.xwd}.png" || true
          done
      - name: Upload smoke screenshots
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            /tmp/cui-smoke/*.png
            /tmp/cui-gallery/*.png
          if-no-files-found: ignore

  # The windowed macOS build compiles the amalgamation as Objective-C. It
  # needs the full Darwin namespace: the amalgamation defines _POSIX_C_SOURCE
  # mid-file, which hides the BSD types (u_char, u_int) that the SDK's
  # netinet/ip.h needs on the Cocoa -> PrintCore -> CUPS include path.
  # cui-sys/build.rs defines _DARWIN_C_SOURCE for exactly that reason.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every extern declaration matches its C prototype
        run: scripts/sigcheck.sh
      # The window layer included: the examples link Cocoa and open a window.
      - run: cargo build --release --examples
      - run: cargo test
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Doc links
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p cui-rs -p cui-sys
      # ... and without it: the bring-your-own-window path.
      - run: cargo build --lib -p cui-rs -p cui-sys --no-default-features
      - run: cargo test -p cui-sys --no-default-features

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo build --release --examples

  # The test suite under AddressSanitizer, with Rust and the C amalgamation
  # both instrumented: a read CUI makes past a short slice, a stale pointer or
  # an unchecked length fails here instead of passing silently. `--target` is
  # spelled out so build scripts and proc macros are not sanitized too, and
  # the C side uses clang so both halves share one sanitizer runtime. Leaks
  # are not reported: this job is after memory errors, not what CUI caches.
  asan:
    # informational until it has been green once: remove the line then
    continue-on-error: true
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -Zsanitizer=address
      CFLAGS_x86_64-unknown-linux-gnu: -fsanitize=address -g
      CC_x86_64-unknown-linux-gnu: clang
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - run: cargo +nightly test --target x86_64-unknown-linux-gnu
      - run: cargo +nightly build --examples --target x86_64-unknown-linux-gnu


