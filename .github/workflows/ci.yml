name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 and the software GL stack
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl1-mesa-dri xvfb
      - run: cargo test
      - name: Feature combinations compile
        run: |
          cargo build -p cui-sys --no-default-features
          cargo build -p cui-sys --no-default-features --features default-fonts
          cargo build -p cui-sys --no-default-features --features stb-image,text-shaping
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release --examples
      - name: Smoke test every example under Xvfb
        run: xvfb-run -a -s "-screen 0 1280x800x24" scripts/smoke.sh target/release/examples
      - name: Convert smoke screenshots
        if: success() || failure()
        run: |
          if ! command -v convert >/dev/null; then sudo apt-get install -y imagemagick; fi
          for f in /tmp/cui-smoke/*.xwd; do
            [ -e "$f" ] || continue
            convert "$f" "${f%.xwd}.png" || true
          done
      - name: Upload smoke screenshots
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: /tmp/cui-smoke/*.png
          if-no-files-found: ignore

  # The windowed macOS build compiles the amalgamation as Objective-C. It
  # needs the full Darwin namespace: the amalgamation defines _POSIX_C_SOURCE
  # mid-file, which hides the BSD types (u_char, u_int) that the SDK's
  # netinet/ip.h needs on the Cocoa -> PrintCore -> CUPS include path.
  # cui-sys/build.rs defines _DARWIN_C_SOURCE for exactly that reason.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The window layer included: the examples link Cocoa and open a window.
      - run: cargo build --release --examples
      - run: cargo test
      # ... and without it: the bring-your-own-window path.
      - run: cargo build --lib -p cui -p cui-sys --no-default-features
      - run: cargo test -p cui-sys --no-default-features

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo build --release --examples

