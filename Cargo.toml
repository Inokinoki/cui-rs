[workspace]
resolver = "2"
members = ["cui-sys", "cui", "cui-macros"]

[workspace.package]
edition = "2021"
authors = ["Inoki <veyx.shaw@gmail.com>"]
license = "MIT"
repository = "https://github.com/Inokinoki/cui-rs"
keywords = ["gui", "ui", "immediate-mode", "ffi", "widgets"]
categories = ["gui"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
