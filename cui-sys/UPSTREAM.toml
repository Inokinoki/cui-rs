# The upstream CUI release that this crate builds against.
#
# The amalgamated release assets for this exact release are committed in
# cui-sys/c/; build.rs verifies both SHA-256 digests (and the
# CUI_VERSION_STRING define inside the header) and compiles from there —
# no network access, and crates.io-compatible.
#
# If cui-sys/c/ is missing, build.rs downloads the same assets from the
# release and verifies them the same way (needs curl).
#
# `./vendor.sh --pin <tag>` moves the pin to another release: it downloads
# that release's assets, checks the embedded version, computes the digests,
# rewrites this file and refreshes cui-sys/c/. `./vendor.sh --fetch`
# re-downloads the pinned release; `./vendor.sh <checkout>` amalgamates a
# local upstream tree into cui-sys/c/ for upstream hacking.

version = "1.4.0"
tag = "v1.4.0"
base_url = "https://github.com/yappologistic/CUI/releases/download"
sha256_cui_h = "3d75b32abe5495997ca10a57ddfe1e0f2cd46ca04520806e92528eb87347aa97"
sha256_cui_c = "7b1da50a0903d33a560af1111d5dda958c7b27935a0f5acd26accf074ba8367c"
