[package]
name = "cui-rs"
description = "Safe, idiomatic Rust bindings for the CUI immediate-mode UI library"
version = "0.1.3+cui1.4.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "cui"

[features]
default = ["app", "default-fonts", "stb-image", "macros"]
# The view! declarative UI macro (pulls in syn; turn it off to avoid that).
macros = ["dep:cui-rs-macros"]
# The window/event layer (cui_app_*). Off = CUI_NO_APP: bring your own window.
app = ["cui-sys/app"]
# Embed the Inter / Geist / Lucide fonts (about 180 KB).
default-fonts = ["cui-sys/default-fonts"]
# PNG and JPEG image loading via stb_image.
stb-image = ["cui-sys/stb-image"]
# Arabic-script shaping and bidi.
text-shaping = ["cui-sys/text-shaping"]

[dependencies]
cui-sys = { path = "../cui-sys", version = "0.1.3", default-features = false }
cui-rs-macros = { path = "../cui-macros", version = "0.1.0", optional = true }

[[example]]
name = "todo_view"
required-features = ["macros"]

[[test]]
name = "view"
required-features = ["macros"]
